<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:var(--gr-page)}
.wrap{position:relative;width:960px;height:304px;overflow:hidden;background:var(--gr-page)}
svg{position:absolute;left:0;top:0}
.cell{rx:var(--radius-4)}
.empty{fill:var(--bk-empty)} .blue{fill:var(--bk-blue)} .yellow{fill:var(--bk-yellow)}
.red{fill:var(--bk-red)} .green{fill:var(--bk-green)} .board{fill:var(--bk-board)}
.mark{fill:var(--bk-mark);opacity:var(--opacity-last)}
.name{position:absolute;left:32px;bottom:64px;max-width:440px;margin:0;font-family:var(--font-sans);
  font-weight:700;font-size:104px;line-height:.95;letter-spacing:-0.02em;color:var(--gr-text)}
.tag{position:absolute;left:32px;bottom:32px;max-width:440px;margin:0;font-family:var(--font-sans);
  font-size:14px;color:var(--bk-muted)}
</style></head><body><div class="wrap">
<svg width="960" height="304" viewBox="0 0 960 304" aria-hidden="true">
